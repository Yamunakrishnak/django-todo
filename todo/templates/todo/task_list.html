<!DOCTYPE html>
<html>
<head>
    <title>To-Do List</title>
    <style>
    body { font-family: sans-serif; max-width: 500px; margin: 40px auto; }
    h1 { text-align: center; }
    .add-form { display: flex; gap: 8px; margin-bottom: 20px; }
    .add-form input { flex: 1; padding: 8px; }
    .add-form button { padding: 8px 16px; }
    ul { list-style: none; padding: 0; }
    li { display: flex; align-items: center; gap: 12px; padding: 10px; border-bottom: 1px solid #ddd; }
    .title { flex: 1; }
    .done { text-decoration: line-through; color: gray; }
    form.inline { display: inline; margin: 0; }
    li a { text-decoration: none; padding: 4px 10px; border: 1px solid #ccc; border-radius: 4px; color: #333; }
    li a:hover { background: #eee; }
    li button { padding: 4px 10px; cursor: pointer; }
</style>
</head>
<body>
    <h1>My To-Do List</h1>

    <form method="post" class="add-form">
        {% csrf_token %}
        {{ form.title }}
        <button type="submit">Add</button>
    </form>

    <ul>
        {% for task in tasks %}
            <li>
                <span class="title {% if task.completed %}done{% endif %}">{{ task.title }}</span>
                <a href="{% url 'task_toggle' task.pk %}">{% if task.completed %}Undo{% else %}Done{% endif %}</a>
                <a href="{% url 'task_edit' task.pk %}">Edit</a>
                <form class="inline" method="post" action="{% url 'task_delete' task.pk %}">
                    {% csrf_token %}
                    <button type="submit">Delete</button>
                </form>
            </li>
        {% empty %}
            <li>No tasks yet.</li>
        {% endfor %}
    </ul>
</body>
</html>
